name: erp-phase1
services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: erp_demo
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?run scripts/init_env.py first}
      PG_APP_PASSWORD: ${PG_APP_PASSWORD:?run scripts/init_env.py first}
      PG_MOCK_PASSWORD: ${PG_MOCK_PASSWORD:?run scripts/init_env.py first}
    ports: ["127.0.0.1:${COMPOSE_DB_PORT:-55433}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp_demo"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: ./backend
    environment: &api-env
      APP_ENV: demo
      DATABASE_URL: postgresql+asyncpg://erp_app:${PG_APP_PASSWORD}@db:5432/erp_demo
      BOSS_URL: http://mock:8001
      BOSS_TOKEN: ${BOSS_TOKEN:?set a local random token}
      WEB_ORIGIN: http://127.0.0.1:5173
      COOKIE_SECURE: "false"
      DEMO_PASSWORD: ${DEMO_PASSWORD:?set a local login password}
      AI_MODE: ${AI_MODE:-offline}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
    command: ["sh", "-c", "python -m alembic upgrade head && python -m app.seed --demo"]
    depends_on:
      db: {condition: service_healthy}
  mock-migrate:
    build: ./mock_boss
    environment: &mock-env
      APP_ENV: demo
      MOCK_DATABASE_URL: postgresql+asyncpg://erp_mock:${PG_MOCK_PASSWORD}@db:5432/erp_demo
      BOSS_TOKEN: ${BOSS_TOKEN}
    command: ["sh", "-c", "python -m alembic upgrade head && python -m app.seed --demo"]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: ./backend
    environment: *api-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      mock: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
  mock:
    build: ./mock_boss
    environment: *mock-env
    depends_on:
      mock-migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build: ./frontend
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  pgdata:
