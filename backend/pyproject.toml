[project]
name = "erp-phase1"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.142.2", "uvicorn==0.54.0", "pydantic==2.13.5",
  "pydantic-settings==2.15.0", "sqlalchemy[asyncio]==2.1.2",
  "asyncpg==0.31.0", "alembic==1.20.0", "httpx==0.28.1",
  "argon2-cffi==25.1.0", "tzdata==2026.4",
  "langchain-core==1.6.6", "langchain-deepseek==1.1.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
